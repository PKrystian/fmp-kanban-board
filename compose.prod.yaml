name: fmp-kanban-board-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: app
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web
    ports:
      - "${HTTP_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - app

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-fmp}
      MYSQL_USER: ${DATABASE_USER:-fmp}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD is required}
    restart: unless-stopped
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database_data:
